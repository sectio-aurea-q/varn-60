[package]
name = "varn-60"
version = "1.2.0"
edition = "2021"
authors = ["sectio-aurea-q <meg.depth@proton.me>"]
description = "VÄRN-60 (Anu) — Automated Side-Channel Scanner for Post-Quantum Cryptography"
license = "PROPRIETARY"

[[bin]]
name = "anu"
path = "src/main.rs"

[dependencies]
# PQC targets
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"
ml-kem = "0.2"
kem = "0.3.0-pre.0"

# Core
rand = "0.8"
statrs = "0.17"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
colored = "2"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
